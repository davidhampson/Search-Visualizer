<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search Visualizer · David J D Hampson</title>
<link rel="stylesheet" href="demo.css">
</head>
<body><main>
<header><h1>Search Visualizer</h1><p>Watch crawlers search for the lowest point on the terrain.</p></header>
<section class="controls" aria-label="Search controls">
<fieldset><legend>Search breadth</legend><div class="choices">
<label><input type="radio" name="breadth" value="focused"><span>Focused</span></label>
<label><input type="radio" name="breadth" value="balanced" checked><span>Balanced</span></label>
<label><input type="radio" name="breadth" value="wide"><span>Wide</span></label>
</div></fieldset>
<p id="allocation"></p>
</section>
<figure>
<div class="terrain"><canvas width="960" height="640" aria-label="Colored crawler trails over a terrain mesh. A star marks the lowest point found."></canvas></div>
<figcaption><strong id="stage">Preparing terrain…</strong><span id="stats"></span></figcaption>
</figure>
<div class="playback"><button type="button" id="play" disabled>Play</button><input id="scrub" type="range" min="0" max="5600" value="0" aria-label="Search progress in moves" disabled><span class="legend"><b aria-hidden="true">★</b> Best found</span></div>
